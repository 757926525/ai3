name = "baihu-ai-three"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ADMIN_USERNAME = "admin"

[ai]
binding = "AI"

# Cloudflare D1 Database binding for Cloudflare Pages Functions
# Replace database_id with your real D1 database ID after running: npx wrangler d1 create baihu_ai_db
